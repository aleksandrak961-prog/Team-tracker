<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Командный трекер</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F0F2F5;--card:#FFF;--ink:#1A202C;--ink2:#4A5568;--ink3:#94A3B8;
  --border:#E2E8F0;--hover:#F7F8FA;--input-bg:#fff;
  --blue:#2563EB;--blue-bg:#EFF6FF;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --green:#059669;--green-bg:#ECFDF5;
  --grey:#94A3B8;--grey-bg:#F1F5F9;
  --red:#DC2626;--red-bg:#FEF2F2;
  --accent:#6366F1;
  --sidebar-bg:#1B2A4A;--sidebar-item:#243658;--sidebar-active:#2D4470;--sidebar-text:#B0BFD8;--sidebar-text-active:#fff;
  --radius:8px;
}
[data-theme=dark]{
  --bg:#111318;--card:#1A1D26;--ink:#E5E7EB;--ink2:#9CA3AF;--ink3:#6B7280;
  --border:#2A2D35;--hover:#22252E;--input-bg:#22252E;
  --blue:#818CF8;--blue-bg:#1E1B4B;
  --amber:#FBBF24;--amber-bg:#422006;
  --green:#34D399;--green-bg:#064E3B;
  --grey:#6B7280;--grey-bg:#1F2937;
  --red:#F87171;--red-bg:#450A0A;
  --accent:#818CF8;
  --sidebar-bg:#0D0F14;--sidebar-item:#15171E;--sidebar-active:#1E2130;--sidebar-text:#6B7280;--sidebar-text-active:#E5E7EB;
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;}
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:200px;background:var(--sidebar-bg);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:fixed;top:0;left:0;bottom:0;z-index:50;}
.sidebar-brand{font-family:'Source Serif 4',serif;font-weight:600;font-size:17px;color:var(--sidebar-text-active);padding:6px 10px 14px;display:flex;justify-content:space-between;align-items:center;}
.sidebar-item{padding:8px 12px;font-size:13px;color:var(--sidebar-text);border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:9px;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.sidebar-item:hover{background:var(--sidebar-item);color:var(--sidebar-text-active);}
.sidebar-item.active{background:var(--sidebar-active);color:var(--sidebar-text-active);border-left:2px solid var(--accent);}
.sidebar-icon{font-size:16px;width:20px;text-align:center;}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:4px;}
.sidebar-user{padding:8px 12px;font-size:12px;color:var(--sidebar-text);display:flex;align-items:center;gap:6px;cursor:pointer;border-radius:6px;}
.sidebar-user:hover{background:var(--sidebar-item);}
.sidebar-user .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.theme-toggle{padding:6px 12px;font-size:12px;color:var(--sidebar-text);display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:6px;border:none;background:none;font-family:inherit;width:100%;text-align:left;}
.theme-toggle:hover{background:var(--sidebar-item);color:var(--sidebar-text-active);}

/* Main content */
.main-content{margin-left:200px;flex:1;padding:20px 24px 60px;max-width:1000px;}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card h2{font-family:'Source Serif 4',serif;font-weight:600;font-size:18px;margin-bottom:12px;}
.card h3{font-size:14px;font-weight:600;margin-bottom:8px;}

/* Forms */
input[type=text],input[type=date],input[type=password],select,textarea{
  padding:7px 10px;border:1px solid var(--border);border-radius:6px;
  font-family:inherit;font-size:13px;background:var(--input-bg);color:var(--ink);
  width:100%;
}
input[type=color]{border:1px solid var(--border);border-radius:6px;background:var(--input-bg);}
textarea{resize:vertical;min-height:60px;}
.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:flex-end;}
.row>*{flex:1;min-width:120px;}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:12px;color:var(--ink2);font-weight:500;}
.btn{
  padding:7px 14px;border:none;border-radius:6px;font-family:inherit;
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--ink2);padding:5px 10px;font-size:12px;}
.btn-ghost:hover{background:var(--hover);}
.btn-danger{background:none;border:1px solid var(--red);color:var(--red);padding:5px 10px;font-size:12px;}
.btn-sm{padding:4px 8px;font-size:12px;}

/* Filters */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filters select{width:auto;min-width:140px;}
.filters label{font-size:12px;color:var(--ink2);font-weight:500;}

/* Board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-height:300px;}
@media(max-width:900px){.board{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.board{grid-template-columns:1fr;}.sidebar{width:56px;}.sidebar-label{display:none;}.main-content{margin-left:56px;}}
.col{background:var(--hover);border-radius:var(--radius);padding:10px;min-height:200px;}
.col-header{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.col-dot{width:10px;height:10px;border-radius:50%;}
.col-count{font-weight:400;color:var(--ink3);}

/* Task cards */
.task-card{
  background:var(--card);border:1px solid var(--border);border-radius:6px;
  padding:10px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s;
}
.task-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.12);}
.task-card.overdue{border-left:3px solid var(--red);}
.task-card.due-soon{border-left:3px solid var(--amber);background:var(--amber-bg);}
.task-title{font-weight:500;font-size:13.5px;margin-bottom:4px;}
.task-meta{font-size:11.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px;}
.task-status-comment{font-size:11.5px;color:var(--amber);margin-top:4px;font-style:italic;}
.priority-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:2px;}
.p-high{background:var(--red);}
.p-medium{background:var(--amber);}
.p-low{background:var(--grey);}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:500;}
.badge-grey{background:var(--grey-bg);color:var(--grey);}
.badge-blue{background:var(--blue-bg);color:var(--blue);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-red{background:var(--red-bg);color:var(--red);}

/* Modal */
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:10px;width:100%;max-width:560px;padding:24px;position:relative;margin-bottom:40px;}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink2);}
.modal h2{font-family:'Source Serif 4',serif;font-weight:600;font-size:20px;margin-bottom:16px;padding-right:30px;}
.comment-list{max-height:200px;overflow-y:auto;margin-bottom:10px;}
.comment-item{padding:8px 0;border-bottom:1px solid var(--border);}
.comment-item:last-child{border-bottom:none;}
.comment-author{font-size:12px;font-weight:600;color:var(--ink);}
.comment-date{font-size:11px;color:var(--ink3);margin-left:6px;}
.comment-text{font-size:13px;margin-top:2px;}

/* Timeline */
.timeline-bar{display:flex;gap:3px;margin:12px 0;align-items:stretch;min-height:36px;}
.stage-block{
  flex:1;border-radius:5px;padding:5px 8px;font-size:11.5px;font-weight:500;
  cursor:pointer;text-align:center;transition:all .15s;position:relative;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
}
.stage-block.past{opacity:1;}
.stage-block.current{outline:2px solid var(--accent);outline-offset:1px;}
.stage-block.future{opacity:.35;}
.stage-dates{font-size:10px;font-weight:400;margin-top:1px;}

/* Team cards */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.member-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.member-role{font-size:12px;color:var(--ink2);font-weight:500;}
.member-name{font-size:15px;font-weight:600;margin-bottom:6px;}
.member-stats{font-size:12px;color:var(--ink2);}
.member-overdue{color:var(--red);font-weight:500;}

.workload-section{margin-bottom:16px;}
.panel{display:none;}
.panel.active{display:block;}

/* User select screen */
.user-select-screen{text-align:center;padding:60px 20px;}
.user-select-screen h2{font-family:'Source Serif 4',serif;font-size:24px;margin-bottom:8px;}
.user-select-screen p{color:var(--ink2);margin-bottom:20px;}
.user-options{display:flex;flex-direction:column;gap:8px;max-width:300px;margin:0 auto;}
.user-option{
  padding:12px;border:1px solid var(--border);border-radius:var(--radius);
  cursor:pointer;font-size:14px;font-weight:500;background:var(--card);color:var(--ink);
  text-align:left;font-family:inherit;
}
.user-option:hover{border-color:var(--accent);background:var(--blue-bg);}
.user-option .role{font-size:12px;color:var(--ink2);font-weight:400;}

.empty{text-align:center;color:var(--ink3);padding:30px;font-size:13px;}
.link{color:var(--accent);cursor:pointer;text-decoration:underline;}
.mb12{margin-bottom:12px;}
.mt8{margin-top:8px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:500;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.25);animation:toastIn .3s ease-out;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ── State ──
let S = {
  team: [],
  projects: [],
  tasks: [],
  activities: [],
  currentUser: null // saved locally
};

const STATUSES = [
  {id:'todo', label:'Не начато', color:'var(--grey)', dotClass:'badge-grey'},
  {id:'progress', label:'В процессе', color:'var(--blue)', dotClass:'badge-blue'},
  {id:'review', label:'Готово к проверке', color:'var(--amber)', dotClass:'badge-amber'},
  {id:'done', label:'Проверено и закрыто', color:'var(--green)', dotClass:'badge-green'}
];
const PRIORITIES = [{id:'high',label:'Высокий'},{id:'medium',label:'Средний'},{id:'low',label:'Низкий'}];
const uid = () => '_'+Math.random().toString(36).slice(2,9);
let activeTab = 'dashboard';
let filters = {project:'all', assignee:'all', status:'all'};
let openTaskId = null;
let editingStage = null;
let confirmDialog = null;
let renameDialog = null;
let pinDialog = null; // {userId}
let isNewTask = false; // true when creating, false when editing
let toastMsg = null; // {text, timeout}

function isManager(){
  const m=S.team.find(x=>x.id===S.currentUser);
  return m && m.role && m.role.toLowerCase().includes('менеджер');
}
function isSenior(){
  const m=S.team.find(x=>x.id===S.currentUser);
  return m && m.role && (m.role.toLowerCase().includes('синьор')||m.role.toLowerCase().includes('синиор')||m.role.toLowerCase().includes('senior'));
}
function isLeadership(){ return isManager()||isSenior(); }

const HOLIDAYS_2026=[
  '2026-01-01','2026-01-02','2026-01-03','2026-01-04','2026-01-05','2026-01-06','2026-01-07','2026-01-08','2026-01-09','2026-01-10','2026-01-11',
  '2026-02-21','2026-02-22','2026-02-23',
  '2026-03-07','2026-03-08','2026-03-09',
  '2026-05-01','2026-05-02','2026-05-03','2026-05-09','2026-05-10','2026-05-11',
  '2026-06-12','2026-06-13','2026-06-14',
  '2026-11-04','2026-12-31'
];
const HOLIDAYS_2027=[
  '2027-01-01','2027-01-02','2027-01-03','2027-01-04','2027-01-05','2027-01-06','2027-01-07','2027-01-08','2027-01-09','2027-01-10',
  '2027-02-21','2027-02-22','2027-02-23',
  '2027-03-06','2027-03-07','2027-03-08',
  '2027-05-01','2027-05-02','2027-05-03','2027-05-08','2027-05-09','2027-05-10',
  '2027-06-12','2027-06-13','2027-06-14',
  '2027-11-04','2027-11-05','2027-11-06','2027-11-07','2027-12-31'
];
const HOLIDAYS=new Set(HOLIDAYS_2026.concat(HOLIDAYS_2027));
// Рабочие субботы (перенос выходных)
const WORKDAYS=new Set(['2027-02-20']);
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isNonWorking(d){
  const s=ymd(d);
  if(WORKDAYS.has(s))return false;
  if(HOLIDAYS.has(s))return 'holiday';
  const dow=d.getDay();
  return (dow===0||dow===6)?'weekend':false;
}

const DEFAULT_GATES=[
  {name:'Договор подписан'},
  {name:'ПКИП пройдён'}
];
const GATE_STATES=[
  {id:'todo',label:'Не начато',color:'var(--red)'},
  {id:'progress',label:'В процессе',color:'var(--amber)'},
  {id:'done',label:'Готово',color:'var(--green)'}
];
function projectGates(p){
  if(!p.gates||!p.gates.length){
    return DEFAULT_GATES.map((g,i)=>({id:'g'+i,name:g.name,state:'todo'}));
  }
  return p.gates;
}
function gatesReady(p){ return projectGates(p).every(g=>g.state==='done'); }
function gatesBlocking(p){ return projectGates(p).filter(g=>g.state!=='done'); }

const MILESTONE_TEMPLATES=[
  {name:'Договор подписан',offset:0},
  {name:'Инфозапрос отправлен',offset:7},
  {name:'Red Flag',offset:28,gated:true},
  {name:'Полный отчёт',offset:45,gated:true},
  {name:'Финал после комментов',offset:60,gated:true}
];

function daysUntil(dateStr){
  if(!dateStr)return null;
  const d=new Date(dateStr), today=new Date(new Date().toDateString());
  return Math.round((d-today)/(1000*60*60*24));
}
function milestoneState(m){
  if(m.done)return 'done';
  const d=daysUntil(m.date);
  if(d===null)return 'future';
  if(d<0)return 'overdue';
  if(d<=7)return 'urgent';
  if(d<=14)return 'soon';
  return 'future';
}
function milestoneColor(state){
  return {done:'var(--green)',overdue:'var(--red)',urgent:'var(--red)',soon:'var(--amber)',future:'var(--ink3)'}[state];
}
function sortedMilestones(p){
  return (p.milestones||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function logActivity(action, type='info'){
  const now=new Date();
  const ts=now.toLocaleDateString('ru-RU')+' '+now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(!S.activities)S.activities=[];
  S.activities.unshift({user:S.currentUser,action,ts,type});
  if(S.activities.length>200)S.activities=S.activities.slice(0,200);
}

// ══════════════════════════════════════════════════════
// ⬇️  ВСТАВЬ СЮДА URL СВОЕЙ FIREBASE БАЗЫ ДАННЫХ  ⬇️
// ══════════════════════════════════════════════════════
const FIREBASE_DB_URL = 'https://team-tracker-babb1-default-rtdb.europe-west1.firebasedatabase.app/';
// ══════════════════════════════════════════════════════

// ── Firebase init ──
let firebaseOk = false;
let firebaseReady = false;
let db, dataRef;
try {
  firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
  db = firebase.database();
  dataRef = db.ref('tracker-data');
  firebaseOk = true;
} catch(e) {
  console.warn('Firebase не подключён, работаем локально:', e);
}

// ── Storage (Firebase + localStorage как подстраховка) ──
const LOCAL_KEY = 'team-tracker-data';

function loadShared(){
  // Сразу загружаем из localStorage (мгновенно, без сети)
  try{
    const r = localStorage.getItem(LOCAL_KEY);
    if(r){const d=JSON.parse(r);S.team=d.team||[];S.projects=d.projects||[];S.tasks=d.tasks||[];S.activities=d.activities||[];S.managerPin=d.managerPin||'0000';}
  }catch(e){}
  // Firebase listener ниже перезапишет данными из облака, когда подключится
}
function saveShared(){
  const data = {team:S.team, projects:S.projects, tasks:S.tasks, activities:S.activities||[], managerPin:S.managerPin||'0000'};
  // Всегда сохраняем локально (мгновенно, надёжно)
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }catch(e){}
  // Если Firebase подключён — отправляем и туда
  if(firebaseOk && dataRef){
    try{ dataRef.set(data); }catch(e){ console.warn('Firebase save error:', e); }
  }
}
function loadUser(){
  try{const r=localStorage.getItem('team-tracker-user');if(r)S.currentUser=r;}catch(e){}
}
function saveUser(){
  try{localStorage.setItem('team-tracker-user',S.currentUser||'');}catch(e){}
}

// ── Push-уведомления ──
let prevTasksJSON = '[]'; // для сравнения с предыдущим состоянием
let notifPermission = 'default';

function requestNotifPermission(){
  if(!('Notification' in window))return;
  notifPermission = Notification.permission;
  if(notifPermission==='default'){
    Notification.requestPermission().then(p=>{notifPermission=p;});
  }
}

function showNotif(title, body){
  if(notifPermission!=='granted')return;
  try{
    const n=new Notification(title,{body,icon:'📋',tag:body,requireInteraction:false});
    setTimeout(()=>n.close(),8000);
  }catch(e){}
}

function checkForNotifications(oldTasks, newTasks){
  if(!S.currentUser||!firebaseReady)return;
  const me=S.currentUser;

  // Новые задачи назначенные мне
  const oldIds=new Set(oldTasks.filter(t=>t.assignee===me&&!t.deleted).map(t=>t.id));
  newTasks.filter(t=>t.assignee===me&&!t.deleted&&!oldIds.has(t.id)).forEach(t=>{
    showNotif('📋 Новая задача', `«${t.title}» — ${projName(t.project)}${t.due?' · до '+formatDate(t.due):''}`);
  });

  // Задача перешла в «Готово к проверке» и я проверяющий
  newTasks.filter(t=>t.reviewer===me&&t.status==='review'&&!t.deleted).forEach(t=>{
    const old=oldTasks.find(o=>o.id===t.id);
    if(old&&old.status!=='review'){
      showNotif('✅ Готово к проверке', `«${t.title}» — ${projName(t.project)}`);
    }
  });

  // Дедлайн изменён на моей задаче
  newTasks.filter(t=>t.assignee===me&&!t.deleted).forEach(t=>{
    const old=oldTasks.find(o=>o.id===t.id);
    if(old&&old.due!==t.due&&old.due&&t.due){
      showNotif('⏰ Дедлайн изменён', `«${t.title}» → ${formatDate(t.due)}`);
    }
  });

  // Задача переназначена мне
  newTasks.filter(t=>t.assignee===me&&!t.deleted).forEach(t=>{
    const old=oldTasks.find(o=>o.id===t.id);
    if(old&&old.assignee!==me){
      showNotif('👤 Задача переназначена тебе', `«${t.title}» — ${projName(t.project)}`);
    }
  });
}

// ── Real-time listener: auto-updates when anyone changes data ──
if(firebaseOk && dataRef){
  dataRef.on('value', (snapshot) => {
    const d = snapshot.val();
    if(d){
      const oldTasks=JSON.parse(prevTasksJSON);
      S.team = d.team || [];
      S.projects = d.projects || [];
      S.tasks = d.tasks || [];
      S.activities = d.activities || [];
      S.managerPin = d.managerPin || '0000';
      // Уведомления о изменениях
      if(firebaseReady){
        checkForNotifications(oldTasks, S.tasks);
      }
      prevTasksJSON=JSON.stringify(S.tasks);
      // Обновляем и локальный кэш
      try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); }catch(e){}
    }
    if(!firebaseReady){
      firebaseReady = true;
      loadUser();
      prevTasksJSON=JSON.stringify(S.tasks);
      requestNotifPermission();
    }
    // Don't re-render if user is editing inside a modal (prevents input resets)
    if(!openTaskId && !editingStage && !confirmDialog && !renameDialog){
      render();
    }
  });
}

// ── Helpers ──
function memberLabel(id){const m=S.team.find(t=>t.id===id);return m?`${m.role} — ${m.name}`:'—';}
function memberShort(id){const m=S.team.find(t=>t.id===id);return m?m.name:'—';}
function projName(id){const p=S.projects.find(x=>x.id===id);return p?p.name:'—';}
function statusObj(id){return STATUSES.find(s=>s.id===id)||STATUSES[0];}
function isOverdue(t){if(t.status==='done'||!t.due)return false;return new Date(t.due)<new Date(new Date().toDateString());}
function isDueSoon(t){
  if(t.status==='done'||!t.due||isOverdue(t))return false;
  const diff=(new Date(t.due)-new Date(new Date().toDateString()))/(1000*60*60*24);
  return diff<=2;
}
function sortTasks(tasks){
  const pOrder={high:0,medium:1,low:2};
  return tasks.slice().sort((a,b)=>{
    const aOv=isOverdue(a)?0:1, bOv=isOverdue(b)?0:1;
    if(aOv!==bOv)return aOv-bOv;
    const aSoon=isDueSoon(a)?0:1, bSoon=isDueSoon(b)?0:1;
    if(aSoon!==bSoon)return aSoon-bSoon;
    const ap=pOrder[a.priority]||1, bp=pOrder[b.priority]||1;
    if(ap!==bp)return ap-bp;
    if(a.due&&b.due)return a.due.localeCompare(b.due);
    if(a.due)return -1;if(b.due)return 1;
    return 0;
  });
}
function filteredTasks(){
  return S.tasks.filter(t=>{
    if(t.deleted)return false;
    if(filters.project!=='all'&&t.project!==filters.project)return false;
    if(filters.assignee!=='all'&&t.assignee!==filters.assignee)return false;
    if(filters.status!=='all'&&t.status!==filters.status)return false;
    return true;
  });
}
function formatDate(d){if(!d)return'';const p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0];}
function contrastText(hex){
  const c=hex.replace('#','');
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.55?'#1A202C':'#FFFFFF';
}

// ── Pipeline (таймлайн проектов) ──
let pipelineScale = 'week';

function renderDashboard(){
  const active=S.projects.filter(p=>(p.status||'active')==='active'&&!p.archived);
  const planned=S.projects.filter(p=>p.status==='planned');
  const archived=S.projects.filter(p=>p.status==='archived'||p.archived);
  const allTasks=S.tasks.filter(t=>!t.deleted);
  const totalActive=allTasks.filter(t=>t.status!=='done').length;
  const totalDone=allTasks.filter(t=>t.status==='done').length;
  const totalOverdue=allTasks.filter(t=>isOverdue(t)).length;
  const shown=active.concat(planned);

  // Collect all dates to determine range
  let allDates=[];
  shown.forEach(p=>{
    (p.stages||[]).forEach(s=>{if(s.startDate)allDates.push(s.startDate);if(s.endDate)allDates.push(s.endDate);});
    (p.milestones||[]).forEach(m=>{if(m.date)allDates.push(m.date);});
  });
  const today=new Date(new Date().toDateString());
  let minD, maxD;
  if(allDates.length){
    allDates.sort();
    minD=new Date(allDates[0]); maxD=new Date(allDates[allDates.length-1]);
  } else {
    minD=new Date(today); maxD=new Date(today.getTime()+60*86400000);
  }
  if(minD>today)minD=new Date(today);
  // Pad range
  minD=new Date(minD.getTime()-3*86400000);
  maxD=new Date(maxD.getTime()+3*86400000);
  const totalMs=maxD-minD;
  const pct=(d)=>{ if(!d)return null; return ((new Date(d)-minD)/totalMs)*100; };

  // Build scale header
  const dayMs=86400000;
  const totalDays=Math.ceil(totalMs/dayMs);
  let headerCells='', weekendBands='';
  const MN=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const DOW=['вс','пн','вт','ср','чт','пт','сб'];
  const monthLabel=(d)=>MN[d.getMonth()].charAt(0).toUpperCase()+MN[d.getMonth()].slice(1)+' '+d.getFullYear();

  // Единая шапка месяцев для всех масштабов.
  // snapWeek: границы месяца сдвигаются на первый понедельник, начиная с 1-го числа.
  function monthBand(snapWeek){
    let html='';
    let mCur=new Date(minD.getFullYear(),minD.getMonth(),1);
    while(mCur<maxD){
      const mEnd=new Date(mCur.getFullYear(),mCur.getMonth()+1,1);
      let segS=new Date(mCur), segE=new Date(mEnd);
      if(snapWeek){
        // первый понедельник, начиная с 1-го числа месяца
        segS.setDate(segS.getDate()+((8-segS.getDay())%7));
        segE.setDate(segE.getDate()+((8-segE.getDay())%7));
      }
      const s=Math.max(segS.getTime(),minD.getTime());
      const e=Math.min(segE.getTime(),maxD.getTime());
      const left=((s-minD.getTime())/totalMs)*100;
      const w=((e-s)/totalMs)*100;
      if(w>0.3) html+=`<div style="position:absolute;left:${left}%;width:${w}%;font-size:10px;font-weight:600;color:var(--ink2);border-left:1px solid var(--border);text-align:center;white-space:nowrap;overflow:hidden;">${w>=8?monthLabel(mCur):''}</div>`;
      mCur=mEnd;
    }
    return html;
  }

  if(pipelineScale==='day'){
    let dayRow='';
    for(let i=0;i<totalDays;i++){
      const d=new Date(minD.getTime()+i*dayMs);
      const nw=isNonWorking(d);
      const isToday=d.toDateString()===today.toDateString();
      const bg=nw==='holiday'?'var(--red-bg)':nw==='weekend'?'var(--hover)':'';
      const col=isToday?'var(--red)':nw==='holiday'?'var(--red)':nw?'var(--ink3)':'var(--ink2)';
      dayRow+=`<div title="${nw==='holiday'?'Праздничный день':nw==='weekend'?'Выходной':'Рабочий день'}" style="flex:1;text-align:center;font-size:9px;color:${col};${isToday?'font-weight:700;':''}${bg?'background:'+bg+';':''}min-width:20px;line-height:1.2;">
        <div style="font-size:8px;opacity:.7;">${DOW[d.getDay()]}</div>${d.getDate()}
      </div>`;
      if(nw) weekendBands+=`<div style="position:absolute;left:${(i/totalDays)*100}%;width:${(1/totalDays)*100}%;top:0;bottom:0;background:${nw==='holiday'?'var(--red-bg)':'var(--hover)'};${nw==='holiday'?'opacity:.7;':''}"></div>`;
    }
    headerCells=`<div style="position:relative;height:14px;margin-bottom:2px;">${monthBand(false)}</div><div style="display:flex;">${dayRow}</div>`;
  } else if(pipelineScale==='week'){
    let weekRow='';
    let cur=new Date(minD);
    cur.setDate(cur.getDate()-((cur.getDay()+6)%7));
    if(cur<minD) cur=new Date(cur.getTime()+7*dayMs);
    while(cur<maxD){
      const left=((cur-minD)/totalMs)*100;
      if(left>=0&&left<=97) weekRow+=`<div style="position:absolute;left:${left}%;font-size:9.5px;color:var(--ink3);border-left:1px solid var(--border);padding-left:3px;white-space:nowrap;">${cur.getDate()}.${String(cur.getMonth()+1).padStart(2,'0')}</div>`;
      cur=new Date(cur.getTime()+7*dayMs);
    }
    headerCells=`<div style="position:relative;height:14px;margin-bottom:2px;">${monthBand(true)}</div><div style="position:relative;height:14px;">${weekRow}</div>`;
  } else {
    headerCells=`<div style="position:relative;height:14px;">${monthBand(false)}</div>`;
  }
  const todayPct=pct(today.toISOString().slice(0,10));

  function projectRow(p){
    const isPlanned=p.status==='planned';
    const stages=(p.stages||[]).slice().sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
    const cur=p.currentStage||0;
    const ms=sortedMilestones(p);
    const pt=allTasks.filter(t=>t.project===p.id);
    const pActive=pt.filter(t=>t.status!=='done').length;
    const pOver=pt.filter(t=>isOverdue(t)).length;

    // Milestones row
    const msH=pipelineScale==='day'?44:pipelineScale==='week'?28:20;
    const msRow=ms.length?`<div style="position:relative;height:${msH}px;margin-bottom:2px;">
      ${ms.map(m=>{
        const l=pct(m.date);
        if(l===null||l<0||l>100)return'';
        const st=milestoneState(m);
        const col=milestoneColor(st);
        const dd=daysUntil(m.date);
        const icon=st==='done'?'✓':'⚑';
        const isUrgent=(st==='urgent'||st==='soon');
        const cd=isUrgent&&dd>=0?` · ${dd}д`:st==='overdue'?' · просрочено':'';
        const blk=gatesBlocking(p);
        const warn=(m.needsGates&&!m.done&&blk.length&&dd!==null&&dd<=30);
        const tip=`${m.name} — ${formatDate(m.date)}${cd}${warn?' ⚠ Не закрыты допуски: '+blk.map(g=>g.name).join(', '):''}`;

        if(pipelineScale==='day'){
          return `<div onclick="openMilestone('${p.id}','${m.id}')" title="${tip}" style="position:absolute;left:${l}%;transform:translateX(-50%);text-align:center;cursor:pointer;max-width:96px;">
            <div style="font-size:9.5px;color:${col};font-weight:${st==='done'?'400':'600'};line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${warn?'⚠ ':''}${m.name}</div>
            <div style="font-size:9px;color:${warn?'var(--red)':col};opacity:.85;white-space:nowrap;">${formatDate(m.date)}${cd}</div>
            <div style="font-size:14px;color:${col};line-height:1;">${icon}</div>
          </div>`;
        }
        if(pipelineScale==='week'){
          return `<div onclick="openMilestone('${p.id}','${m.id}')" title="${tip}" style="position:absolute;left:${l}%;transform:translateX(-50%);text-align:center;cursor:pointer;">
            <div style="font-size:${isUrgent||st==='overdue'?'15':'13'}px;color:${col};line-height:1;">${warn?'⚠':icon}</div>
            <div style="font-size:8px;color:${col};white-space:nowrap;">${formatDate(m.date).slice(0,5)}</div>
          </div>`;
        }
        return `<div onclick="openMilestone('${p.id}','${m.id}')" title="${tip}" style="position:absolute;left:${l}%;transform:translateX(-50%);text-align:center;cursor:pointer;">
          <div style="font-size:${isUrgent||st==='overdue'?'15':'12'}px;color:${col};line-height:1;">${warn?'⚠':icon}</div>
        </div>`;
      }).join('')}
    </div>`:'<div style="height:6px;"></div>';

    const barH=pipelineScale==='day'?26:pipelineScale==='week'?20:16;
    const barFont=pipelineScale==='day'?'10.5px':pipelineScale==='week'?'9.5px':'0px';
    const barsRow=`<div style="position:relative;height:${barH+2}px;">
      ${weekendBands}
      ${stages.map((s,i)=>{
        const l=pct(s.startDate), r=pct(s.endDate);
        if(l===null||r===null)return'';
        const w=Math.max(r-l,1.5);
        const isCur=(i===cur);
        return `<div title="${s.name}: ${s.startDate?formatDate(s.startDate):''} — ${s.endDate?formatDate(s.endDate):''}" style="position:absolute;left:${l}%;width:${w}%;height:${barH}px;background:${isCur?s.color:s.color+'55'};${isCur?'border:2px solid '+s.color+';':''}border-radius:${pipelineScale==='month'?'3':'4'}px;display:flex;align-items:center;padding:0 5px;font-size:${barFont};color:${isCur?contrastText(s.color):'var(--ink2)'};overflow:hidden;white-space:nowrap;">${pipelineScale!=='month'?s.name:''}</div>`;
      }).join('')}
      ${!stages.length&&isPlanned?`<div style="position:absolute;left:2%;width:40%;height:${barH}px;border:1px dashed var(--ink3);border-radius:3px;display:flex;align-items:center;padding:0 6px;font-size:${barFont};color:var(--ink3);">${pipelineScale!=='month'?'Планируется':''}</div>`:''}
      ${!isPlanned&&!stages.filter(s=>s.startDate&&s.endDate).length&&!ms.length?`<div style="position:absolute;left:0;height:${barH}px;display:flex;align-items:center;font-size:10px;color:var(--ink3);font-style:italic;">${pipelineScale==='day'?'Задай даты стадий и контрольных точек во вкладке «Проекты»':'—'}</div>`:''}
      ${todayPct>=0&&todayPct<=100?`<div style="position:absolute;left:${todayPct}%;top:-4px;width:2px;height:${barH+8}px;background:var(--red);"></div>`:''}
    </div>`;

    return `<div style="display:flex;margin-bottom:14px;align-items:flex-end;">
      <div style="width:130px;flex-shrink:0;padding-bottom:4px;">
        <div style="font-size:12.5px;font-weight:500;${isPlanned?'color:var(--ink2);':''}">${p.name}</div>
        <div style="font-size:10px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;">
          ${(()=>{const blk=gatesBlocking(p);
            return blk.length
              ?`<span title="${blk.map(g=>g.name).join(', ')}" style="color:var(--red);cursor:help;">🔴 допуски</span>`
              :`<span style="color:var(--green);">🟢 допуски</span>`;
          })()}
          ${pOver?`<span style="color:var(--red);">⚠ ${pOver}</span>`:''}
          ${isPlanned?`<span style="color:var(--amber);">планируется</span>`:''}
        </div>
      </div>
      <div style="flex:1;min-width:0;">${msRow}${barsRow}</div>
    </div>`;
  }

  return `
  <div class="card">
    <div class="flex-between" style="flex-wrap:wrap;gap:8px;">
      <h2 style="margin:0;">Пайплайн проектов</h2>
      <div style="display:flex;gap:14px;font-size:13px;">
        <span>📋 ${totalActive} активных</span>
        <span style="color:var(--green)">✓ ${totalDone} закрыто</span>
        ${totalOverdue?`<span style="color:var(--red)">⚠ ${totalOverdue} просрочено</span>`:''}
      </div>
    </div>
  </div>

  ${(()=>{
    const warns=[];
    shown.forEach(p=>{
      const blk=gatesBlocking(p);
      if(!blk.length)return;
      sortedMilestones(p).forEach(m=>{
        if(m.done||!m.needsGates)return;
        const dd=daysUntil(m.date);
        if(dd===null||dd>30)return;
        warns.push({proj:p.name,ms:m.name,dd,gates:blk.map(g=>g.name).join(', ')});
      });
    });
    if(!warns.length)return'';
    warns.sort((a,b)=>a.dd-b.dd);
    return `<div class="card" style="border-left:3px solid var(--red);background:var(--red-bg);">
      <h3 style="color:var(--red);margin-bottom:8px;">⚠ Риски по допускам</h3>
      ${warns.map(w=>`<div style="font-size:12.5px;margin-bottom:4px;">
        <strong>${w.proj}</strong> — «${w.ms}» ${w.dd<0?'просрочена':`через ${w.dd} дн.`}, не закрыто: ${w.gates}
      </div>`).join('')}
    </div>`;
  })()}

  <div class="card">
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
      <span style="font-size:12px;color:var(--ink2);">Масштаб:</span>
      ${['day','week','month'].map(sc=>`<button class="btn ${pipelineScale===sc?'btn-primary':'btn-ghost'}" onclick="setPipelineScale('${sc}')" style="font-size:12px;padding:4px 12px;">${sc==='day'?'Дни':sc==='week'?'Недели':'Месяцы'}</button>`).join('')}
    </div>

    <div style="overflow-x:auto;">
      <div style="min-width:${pipelineScale==='day'?Math.max(680,totalDays*22):680}px;">
        <div style="display:flex;margin-bottom:6px;">
          <div style="width:130px;flex-shrink:0;"></div>
          <div style="flex:1;position:relative;height:${pipelineScale==='day'?32:pipelineScale==='week'?30:14}px;">${headerCells}</div>
        </div>
        ${shown.map(p=>projectRow(p)).join('')}
      </div>
    </div>

    ${shown.length===0?'<div class="empty">Нет проектов — добавь во вкладке «Проекты»</div>':`
    <div style="display:flex;gap:14px;font-size:11px;color:var(--ink3);margin-top:8px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap;">
      <span>⚑ контрольная точка · ✓ пройдена</span>
      <span>Жирная рамка — текущая стадия</span>
      <span style="color:var(--red);">Красная линия — сегодня</span>
      ${pipelineScale==='day'?`<span><span style="display:inline-block;width:10px;height:10px;background:var(--hover);vertical-align:-1px;"></span> выходной · <span style="display:inline-block;width:10px;height:10px;background:var(--red-bg);vertical-align:-1px;"></span> праздник</span>`:''}
    </div>`}
  </div>

  ${archived.length?`<div style="font-size:13px;color:var(--ink3);">📦 <strong>Завершённые:</strong> ${archived.map(p=>p.name).join(', ')}</div>`:''}
  `;
}
window.setPipelineScale=(s)=>{pipelineScale=s;render();};

// ── Activity Feed ──
function renderActivity(){
  const acts=(S.activities||[]).slice(0,100);
  const typeStyles={
    alert: {border:'var(--red)', bg:'var(--red-bg)', icon:'🔴', label:'Внимание'},
    change: {border:'var(--amber)', bg:'var(--amber-bg)', icon:'🟠', label:'Изменение'},
    progress: {border:'var(--green)', bg:'var(--green-bg)', icon:'🟢', label:'Прогресс'},
    info: {border:'var(--border)', bg:'transparent', icon:'⚪', label:'Информация'}
  };

  const alertCount=acts.filter(a=>a.type==='alert').length;
  const changeCount=acts.filter(a=>a.type==='change').length;
  const progressCount=acts.filter(a=>a.type==='progress').length;

  return `
  <div class="card">
    <h2>Лента активности</h2>
    <div style="display:flex;gap:12px;font-size:12px;margin-top:4px;flex-wrap:wrap;">
      <span>🔴 Внимание: ${alertCount}</span>
      <span>🟠 Изменения: ${changeCount}</span>
      <span>🟢 Прогресс: ${progressCount}</span>
      <span>⚪ Информация: ${acts.length - alertCount - changeCount - progressCount}</span>
    </div>
  </div>
  <div class="card">
    ${acts.length?acts.map(a=>{
      const st=typeStyles[a.type]||typeStyles.info;
      return `
      <div style="padding:8px 10px;margin-bottom:4px;border-left:3px solid ${st.border};background:${st.bg};border-radius:0 6px 6px 0;display:flex;gap:10px;align-items:flex-start;">
        <span style="font-size:14px;">${st.icon}</span>
        <div style="flex:1;">
          <span style="font-size:13px;"><strong>${memberShort(a.user)}</strong> ${a.action}</span>
          <div style="font-size:11px;color:var(--ink3);margin-top:2px;">${a.ts}</div>
        </div>
      </div>`;
    }).join(''):'<div class="empty">Пока нет активности</div>'}
  </div>

  ${renderTrash()}

  <div style="margin-top:12px;">
    <button class="btn btn-primary" onclick="exportToCSV()">📥 Экспорт задач в Excel (CSV)</button>
  </div>
  `;
}

function renderTrash(){
  const trash=S.tasks.filter(t=>t.deleted);
  if(!trash.length&&!isManager()) return '';
  return `
  <div class="card" style="margin-top:14px;">
    <div class="flex-between">
      <h3 style="margin:0;">🗑 Корзина ${trash.length?`(${trash.length})`:''}</h3>
      ${isManager()&&trash.length?`<button class="btn btn-danger btn-sm" onclick="emptyTrash()">Очистить корзину</button>`:''}
    </div>
    ${trash.length?`
    <div style="margin-top:10px;">
      ${trash.map(t=>`
        <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">
          <span style="flex:1;font-size:13px;color:var(--ink2);">
            ${t.title}
            <span style="font-size:11px;color:var(--ink3);margin-left:6px;">${projName(t.project)} · удалено ${t.deletedAt?formatDate(t.deletedAt.slice(0,10)):''}</span>
          </span>
          <button class="btn-ghost" onclick="restoreTask('${t.id}')" style="color:var(--green);">↩ Восстановить</button>
          ${isManager()?`<button class="btn-ghost" onclick="permanentDeleteTask('${t.id}')" style="color:var(--red);">× Навсегда</button>`:''}
        </div>
      `).join('')}
    </div>
    `:'<p style="font-size:13px;color:var(--ink3);margin-top:8px;">Корзина пуста</p>'}

// ── Export CSV ──
window.exportToCSV=()=>{
  const headers=['Задача','Описание','Проект','Исполнитель','Проверяющий','Стадия','Статус','Приоритет','Дедлайн','Статус-комментарий'];
  const rows=S.tasks.filter(t=>!t.deleted).map(t=>{
    const proj=S.projects.find(p=>p.id===t.project);
    const stage=(proj?.stages||[]).find(s=>s.id===t.stage);
    return [
      t.title, t.description||'', projName(t.project), memberLabel(t.assignee), memberLabel(t.reviewer),
      stage?stage.name:'', statusObj(t.status).label,
      (PRIORITIES.find(p=>p.id===t.priority)||{}).label||'',
      t.due||'', t.statusComment||''
    ].map(v=>'"'+(v||'').replace(/"/g,'""')+'"').join(',');
  });
  const csv='\uFEFF'+headers.join(',')+'\n'+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='tracker-export-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
};

// ── Board ──
function renderBoard(){

      <option value="all">Все</option>

    <div class="field"><label>Статус</label><select onchange="filters.status=this.value;render()">

    <div class="field"><label>&nbsp;</label>
      <div style="display:flex;gap:6px;">

function renderBoardStageBanner(){
  const p=S.projects.find(x=>x.id===filters.project);
  if(!p||!p.stages||!p.stages.length)return'';
  const idx=p.currentStage||0;
  const stages=p.stages;
  const current=stages[idx];
  if(!current)return'';
  const txtCol=contrastText(current.color);
  return `
  <div class="card" style="padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <span style="font-size:12px;color:var(--ink2);font-weight:500;">Текущая стадия:</span>
    <span style="background:${current.color};color:${txtCol};padding:4px 12px;border-radius:5px;font-size:13px;font-weight:600;">▶ ${current.name}</span>
    <span style="font-size:12px;color:var(--ink3);">Стадия ${idx+1} из ${stages.length}${current.endDate?' · до '+formatDate(current.endDate):''}</span>
    <div style="flex:1;display:flex;gap:2px;min-width:120px;">
      ${stages.map((s,i)=>`<div style="flex:1;height:6px;border-radius:3px;background:${i<=idx?s.color:s.color+'30'}"></div>`).join('')}

  </div>`;
}

function renderTaskCard(t){
  const ov=isOverdue(t);
  const soon=isDueSoon(t);
  const cardClass=ov?'overdue':soon?'due-soon':'';
  return `
  <div class="task-card ${cardClass}" draggable="true" ondragstart="dragTask(event,'${t.id}')" onclick="openTask('${t.id}')">
    <div class="task-title"><span class="priority-dot p-${t.priority}"></span>${t.title}</div>
    <div class="task-meta">
      <span>${memberShort(t.assignee)}</span>
      ${t.reviewer?`<span style="color:var(--ink3)">→ ${memberShort(t.reviewer)}</span>`:''}
      <span>${projName(t.project)}</span>
      ${t.due?`<span${ov?' style="color:var(--red);font-weight:500"':soon?' style="color:var(--amber);font-weight:500"':''}>${formatDate(t.due)}${soon?' 🔥':''}</span>`:''}
    </div>
    ${t.statusComment?`<div class="task-status-comment">💬 ${t.statusComment}</div>`:''}
  </div>`;
}

// ── Drag & Drop ──
window.dragTask=(e,id)=>{e.dataTransfer.setData('text/plain',id);};
window.dropTask=(e,status)=>{
  e.preventDefault();
  const id=e.dataTransfer.getData('text/plain');
  const t=S.tasks.find(x=>x.id===id);
  if(t){t.status=status;saveShared();render();}
};

        <div class="field"><label>Исполнитель</label>

          </select>

      </div>
      <div class="row">
        <div class="field"><label>Проверяющий</label>
          <select onchange="${updFn}('${t.id}','reviewer',this.value)">
            <option value="">— не назначен —</option>
            ${S.team.map(m=>`<option value="${m.id}" ${t.reviewer===m.id?'selected':''}>${m.role} — ${m.name}</option>`).join('')}

        </div>
        <div class="field"><label>Стадия проекта</label>
          <select id="task-stage-select" onchange="${updFn}('${t.id}','stage',this.value)">

            ${(taskProj?.stages||[]).map(s=>`<option value="${s.id}" ${t.stage===s.id?'selected':''}>${s.name}</option>`).join('')}

window.openTask=(id)=>{
  isNewTask=false;openTaskId=id;
  const t=S.tasks.find(x=>x.id===id);
  if(t)S._snapshot=JSON.parse(JSON.stringify(t));
  render();
};
window.cancelModal=()=>{
  if(isNewTask){S._draft=null;}
  else if(S._snapshot){
    const idx=S.tasks.findIndex(x=>x.id===openTaskId);
    if(idx>=0)S.tasks[idx]=S._snapshot;
  }
  openTaskId=null;isNewTask=false;S._snapshot=null;render();
};
window.closeModal=()=>{openTaskId=null;isNewTask=false;S._draft=null;S._snapshot=null;render();};
window.updateDraft=(id,field,val)=>{
  if(S._draft){S._draft[field]=val;}
  if(field==='project'&&S._draft){S._draft.stage='';render();}
};
window.updateTask=(id,field,val)=>{
  const t=S.tasks.find(x=>x.id===id);
  if(!t)return;
  t[field]=val;
  if(field==='project'){t.stage='';render();}
};
window.confirmCreateTask=()=>{
  if(!S._draft)return;
  if(!S._draft.title.trim()){
    const el=document.getElementById('modal-title');
    if(el){el.style.borderColor='var(--red)';el.focus();}
    return;
  }
  S.tasks.push(S._draft);
  logActivity('создал(а) задачу «'+S._draft.title+'» ('+projName(S._draft.project)+')', 'info');
  S._draft=null;openTaskId=null;isNewTask=false;
  saveShared();showToast('✓ Задача создана');
};
window.confirmSaveTask=()=>{
  const t=S.tasks.find(x=>x.id===openTaskId);
  if(!t)return;
  const snap=S._snapshot;
  if(snap){
    if(snap.status!==t.status) logActivity('изменил(а) статус «'+t.title+'» → '+statusObj(t.status).label, (t.status==='done'||t.status==='review')?'progress':'change');
    if(snap.due!==t.due) logActivity('перенёс(ла) дедлайн «'+t.title+'» → '+(t.due?formatDate(t.due):'без срока'), 'alert');
    if(snap.assignee!==t.assignee) logActivity('назначил(а) «'+t.title+'» → '+memberShort(t.assignee), 'change');
  }
  S._snapshot=null;openTaskId=null;isNewTask=false;
  saveShared();showToast('✓ Изменения сохранены');
};
window.deleteTask=(id)=>{
  const t=S.tasks.find(x=>x.id===id);
  if(!t)return;
  t.deleted=true;
  t.deletedAt=new Date().toISOString();
  logActivity(`переместил(а) задачу «${t.title}» в корзину`, 'alert');
  openTaskId=null;
  saveShared();render();
};
window.restoreTask=(id)=>{
  const t=S.tasks.find(x=>x.id===id);
  if(!t)return;
  delete t.deleted;
  delete t.deletedAt;
  logActivity(`восстановил(а) задачу «${t.title}» из корзины`, 'progress');
  saveShared();render();
};
window.permanentDeleteTask=(id)=>{
  const t=S.tasks.find(x=>x.id===id);
  confirmDialog={
    message:`Удалить задачу «${t?t.title:''}» навсегда? Это действие нельзя отменить.`,
    onConfirm:()=>{
      if(t) logActivity(`окончательно удалил(а) задачу «${t.title}»`, 'alert');
      S.tasks=S.tasks.filter(x=>x.id!==id);
      saveShared();render();
    }
  };
  render();
};
window.emptyTrash=()=>{
  const trashCount=S.tasks.filter(t=>t.deleted).length;
  confirmDialog={
    message:`Удалить все ${trashCount} задач из корзины навсегда?`,
    onConfirm:()=>{
      logActivity(`очистил(а) корзину (${trashCount} задач)`, 'alert');
      S.tasks=S.tasks.filter(t=>!t.deleted);
      saveShared();render();
    }
  };
  render();
};
window.addComment=(id)=>{
  const inp=document.getElementById('comment-input');
  if(!inp||!inp.value.trim())return;
  const t=S.tasks.find(x=>x.id===id);
  if(!t)return;
  if(!t.comments)t.comments=[];
  const now=new Date();
  t.comments.push({
    cid:uid(),
    author:S.currentUser,
    text:inp.value.trim(),
    date:now.toLocaleDateString('ru-RU')+' '+now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})
  });
  saveShared();render();
};
window.editComment=(taskId,idx)=>{
  const t=S.tasks.find(x=>x.id===taskId);
  if(!t||!t.comments||!t.comments[idx])return;
  const c=t.comments[idx];
  if(c.author!==S.currentUser&&!isManager())return;
  const savedOpenTask=openTaskId;
  renameDialog={
    title:'Редактировать комментарий',
    label:'Текст',
    value:c.text,
    onSave:(val)=>{
      if(val.trim()){
        c.text=val.trim();
        c.edited=true;
        openTaskId=savedOpenTask;
        saveShared();
      }
    }
  };
  openTaskId=null;
  render();
  openTaskId=savedOpenTask;
};
window.deleteComment=(taskId,idx)=>{
  const t=S.tasks.find(x=>x.id===taskId);
  if(!t||!t.comments||!t.comments[idx])return;
  const c=t.comments[idx];
  if(c.author!==S.currentUser&&!isManager())return;
  t.comments.splice(idx,1);
  saveShared();render();
};

// ── New Task Modal ──
function showToast(msg){
  toastMsg=msg;render();
  setTimeout(()=>{toastMsg=null;render();},2500);
}

window.openNewTask=()=>{
  const activeProjects=S.projects.filter(p=>!p.archived);
  if(S.projects.length===0){alert('Сначала добавь хотя бы один проект во вкладке «Проекты»');return;}
  if(S.team.length===0){alert('Сначала добавь участников во вкладке «Команда»');return;}
  const defaultProject=(activeProjects[0]||S.projects[0]).id;
  const id=uid();
  // Задача создаётся как черновик — НЕ сохраняется в Firebase пока не нажмут «Создать»
  S._draft={
    id,title:'',project:defaultProject,assignee:S.currentUser||S.team[0].id,
    reviewer:'',stage:'',status:'todo',priority:'medium',due:'',description:'',statusComment:'',comments:[]
  };
  isNewTask=true;
  openTaskId=id;
  render();
};

// ── Projects ──
let archivedExpanded = false;

function renderProjects(){
  const active=S.projects.filter(p=>(p.status||'active')==='active'&&!p.archived);
  const planned=S.projects.filter(p=>p.status==='planned');
  const archived=S.projects.filter(p=>p.status==='archived'||p.archived);
  return `
  ${isLeadership()?`<div class="card">
    <h2>Новый проект</h2>
    <div class="row">
      <div class="field"><input type="text" id="new-proj-name" placeholder="Название нового проекта"></div>
      <div class="field"><label>Статус</label><select id="new-proj-status">
        <option value="active">В работе</option>
        <option value="planned">Планируется</option>
      </select></div>
      <div class="field" style="flex:0"><button class="btn btn-primary" onclick="addProject()">Добавить</button></div>
    </div>
  </div>`:''}

  <h3 style="margin:16px 0 8px;font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:0.03em;">🔄 В работе (${active.length})</h3>
  ${active.map(p=>renderProjectCard(p)).join('')}
  ${active.length===0?'<div class="empty">Нет активных проектов</div>':''}

  ${planned.length?`
  <h3 style="margin:20px 0 8px;font-size:13px;color:var(--amber);text-transform:uppercase;letter-spacing:0.03em;">🔮 Планируемые (${planned.length})</h3>
  ${planned.map(p=>renderProjectCard(p)).join('')}
  `:''}

  ${archived.length?`
  <div style="margin-top:20px;">
    <div class="flex-between" style="cursor:pointer;" onclick="toggleArchived()">
      <h3 style="font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:0.03em;margin:0;">📦 Завершённые (${archived.length})</h3>
      <span style="font-size:12px;color:var(--ink3);">${archivedExpanded?'скрыть ▲':'показать ▼'}</span>
    </div>
    ${archivedExpanded?archived.map(p=>renderProjectCard(p)).join(''):''}
  </div>
  `:''}
  `;
}
window.toggleArchived=()=>{archivedExpanded=!archivedExpanded;render();};

function renderProjectCard(p){
  let stages=(p.stages||[]).slice();
  // Sort chronologically by start date
  stages.sort((a,b)=>{
    if(!a.startDate&&!b.startDate)return 0;
    if(!a.startDate)return 1;
    if(!b.startDate)return -1;
    return a.startDate.localeCompare(b.startDate);
  });
  p.stages=stages; // keep sorted
  const currentIdx=p.currentStage||0;
  const allTasks=S.tasks.filter(t=>t.project===p.id&&!t.deleted);
  const taskCount=allTasks.filter(t=>t.status!=='done').length;
  const doneCount=allTasks.filter(t=>t.status==='done').length;
  const pStatus=p.status||'active';
  const statusLabel={planned:'🔮 Планируется',active:'🔄 В работе',archived:'📦 Завершён'}[pStatus];
  const statusBadge={planned:'badge-amber',active:'badge-blue',archived:'badge-grey'}[pStatus];
  const cardStyle=pStatus==='archived'?'opacity:0.7;background:var(--hover);':pStatus==='planned'?'border-left:3px solid var(--amber);':'';
  return `
  <div class="card" style="${cardStyle}">
    <div class="flex-between mb12">
      <h2 style="margin:0">${p.name} <span class="badge ${statusBadge}" style="vertical-align:middle;font-size:11px;">${statusLabel}</span></h2>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--ink2);">${taskCount} активных · ${doneCount} закрыто</span>
        ${isLeadership()?`
          ${pStatus==='planned'?`<button class="btn btn-primary btn-sm" onclick="setProjectStatus('${p.id}','active')">▶ Запустить</button>`:''}
          ${pStatus==='active'?`
            <button class="btn-ghost" onclick="setProjectStatus('${p.id}','planned')">🔮 В планируемые</button>
            <button class="btn-ghost" onclick="setProjectStatus('${p.id}','archived')">📦 Завершить</button>
          `:''}
          ${pStatus==='archived'?`<button class="btn btn-primary btn-sm" onclick="setProjectStatus('${p.id}','active')">↩ Возобновить</button>`:''}
        `:''}
        ${isManager()?`
          <button class="btn-ghost" onclick="renameProject('${p.id}')">✏️</button>
          ${(taskCount+doneCount)===0?`<button class="btn btn-danger btn-sm" onclick="deleteProject('${p.id}')">🗑</button>`:''}
        `:''}
      </div>
    </div>
    ${stages.length?`
      <div style="font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:500;">Таймлайн проекта <span style="color:var(--ink3);font-weight:400;">— нажми на стадию, чтобы отметить как текущую</span></div>
      <div class="timeline-bar">
        ${stages.map((s,i)=>{
          const cls=i<currentIdx?'past':i===currentIdx?'current':'future';
          const stageTasks=allTasks.filter(t=>t.stage===s.id);
          const sDone=stageTasks.filter(t=>t.status==='done').length;
          const sActive=stageTasks.length-sDone;
          const icon=cls==='past'?'✓ ':cls==='current'?'▶ ':'';
          const isCurrent=cls==='current';
          const bgColor=isCurrent?s.color:s.color+'30';
          const borderW=isCurrent?'2px':'1px';
          const txtColor=isCurrent?contrastText(s.color):'var(--ink)';
          const dateColor=isCurrent?contrastText(s.color)+'cc':'var(--ink3)';
          const fw=isCurrent?'700':'500';
          return `<div class="stage-block ${cls}" style="background:${bgColor};border:${borderW} solid ${s.color};color:${txtColor}" onclick="setCurrentStage('${p.id}',${i})">
            <span style="font-size:11.5px;line-height:1.2;font-weight:${fw}">${icon}${s.name}</span>
            ${s.startDate||s.endDate?`<span class="stage-dates" style="color:${dateColor}">${s.startDate?formatDate(s.startDate):''}${s.endDate?' → '+formatDate(s.endDate):''}</span>`:''}
            ${stageTasks.length?`<span class="stage-dates" style="color:${dateColor}">📋 ${sDone}/${stageTasks.length}</span>`:''}
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:12px;margin-top:6px;font-size:11px;color:var(--ink3);">
        <span>✓ — пройденная</span><span>▶ — текущая</span><span>📋 выполнено/всего</span>
      </div>
    `:'<div style="font-size:13px;color:var(--ink3);margin-bottom:8px;">Стадии не добавлены</div>'}

    ${(()=>{const gts=projectGates(p);const blk=gatesBlocking(p);return `
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
      <div class="flex-between" style="margin-bottom:8px;">
        <h3 style="margin:0;">${blk.length?'🔴':'🟢'} Допуски <span style="font-weight:400;color:var(--ink3);font-size:12px;">— можно ли отдавать результат</span></h3>
        ${isLeadership()?`<button class="btn-ghost" onclick="addGate('${p.id}')">+ Пункт</button>`:''}
      </div>
      ${gts.map(g=>{
        const st=GATE_STATES.find(s=>s.id===g.state)||GATE_STATES[0];
        return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);">
          <span style="width:9px;height:9px;border-radius:50%;background:${st.color};display:inline-block;flex-shrink:0;"></span>
          <span style="flex:1;font-size:13px;">${g.name}</span>
          ${isLeadership()?`
            <select onchange="setGateState('${p.id}','${g.id}',this.value)" style="width:auto;font-size:12px;padding:3px 6px;">
              ${GATE_STATES.map(s=>`<option value="${s.id}" ${g.state===s.id?'selected':''}>${s.label}</option>`).join('')}
            </select>
            <button class="btn-ghost" onclick="editGate('${p.id}','${g.id}')" style="font-size:11px;">✏️</button>
            <button class="btn-ghost" onclick="removeGate('${p.id}','${g.id}')" style="font-size:11px;color:var(--red);">×</button>
          `:`<span class="badge" style="background:${st.color}22;color:${st.color};">${st.label}</span>`}
        </div>`;
      }).join('')}
      ${blk.length?`<div style="font-size:11.5px;color:var(--red);margin-top:8px;">Не закрыто: ${blk.map(g=>g.name).join(', ')} — контрольные точки с отметкой «требует допусков» будут подсвечены</div>`:'<div style="font-size:11.5px;color:var(--green);margin-top:8px;">Все допуски закрыты — можно отдавать результат</div>'}
    </div>`;})()}

    ${(()=>{const ms=sortedMilestones(p);return `
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
      <div class="flex-between" style="margin-bottom:8px;">
        <h3 style="margin:0;">⚑ Контрольные точки <span style="font-weight:400;color:var(--ink3);font-size:12px;">— договорные даты сдачи</span></h3>
        ${isLeadership()&&!ms.length?`<button class="btn-ghost" onclick="applyMilestoneTemplate('${p.id}')">Типовой набор DD</button>`:''}
      </div>
      ${ms.length?`<div>${ms.map(m=>{
        const st=milestoneState(m); const col=milestoneColor(st); const dd=daysUntil(m.date);
        return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);">
          <span style="font-size:14px;color:${col};">${m.done?'✓':'⚑'}</span>
          <span style="flex:1;font-size:13px;${m.done?'color:var(--ink3);text-decoration:line-through;':''}">${m.name}</span>
          <span style="font-size:12px;color:${col};white-space:nowrap;">${formatDate(m.date)}${!m.done&&dd!==null?(dd<0?' · просрочено':dd<=14?` · ${dd}д`:''):''}</span>
          ${isLeadership()?`
            <button class="btn-ghost" onclick="toggleMilestoneGates('${p.id}','${m.id}')" title="${m.needsGates?'Требует допусков — нажми чтобы снять':'Не требует допусков — нажми чтобы включить'}" style="font-size:11px;${m.needsGates?'color:var(--amber);':''}">${m.needsGates?'🔒':'🔓'}</button>
            <button class="btn-ghost" onclick="toggleMilestone('${p.id}','${m.id}')" title="${m.done?'Снять отметку':'Отметить пройденной'}" style="font-size:11px;">${m.done?'↩':'✓'}</button>
            <button class="btn-ghost" onclick="openMilestone('${p.id}','${m.id}')" style="font-size:11px;">✏️</button>
            <button class="btn-ghost" onclick="removeMilestone('${p.id}','${m.id}')" style="font-size:11px;color:var(--red);">×</button>
          `:''}
        </div>`;
      }).join('')}</div>`:'<div style="font-size:12.5px;color:var(--ink3);">Контрольные точки не добавлены</div>'}
      ${isLeadership()?`
      <div class="row" style="align-items:flex-end;margin-top:10px;">
        <div class="field"><label>Новая контрольная точка</label><input type="text" id="ms-name-${p.id}" placeholder="Red Flag"></div>
        <div class="field"><label>Дата</label><input type="date" id="ms-date-${p.id}"></div>
        <div class="field" style="flex:0"><button class="btn btn-primary" onclick="addMilestone('${p.id}')">+</button></div>
      </div>`:''}
    </div>`;})()}

    ${isLeadership()?`
    <div style="margin-top:14px;">
      <h3>Добавить стадию</h3>
      <div class="row" style="align-items:flex-end">
        <div class="field"><label>Название</label><input type="text" id="stage-name-${p.id}" placeholder="Сбор данных"></div>
        <div class="field"><label>Цвет</label><input type="color" id="stage-color-${p.id}" value="#2563EB" style="height:35px;padding:2px;"></div>
        <div class="field"><label>Начало</label><input type="date" id="stage-start-${p.id}"></div>
        <div class="field"><label>Конец</label><input type="date" id="stage-end-${p.id}"></div>
        <div class="field" style="flex:0"><button class="btn btn-primary" onclick="addStage('${p.id}')">+</button></div>
      </div>
    </div>

    ${stages.length?`
    <div style="margin-top:10px;">
      <h3>Управление стадиями</h3>
      <table style="width:100%;font-size:12.5px;border-collapse:collapse;">
        <thead><tr style="border-bottom:1px solid var(--border);text-align:left;">
          <th style="padding:4px 6px;">Цвет</th><th style="padding:4px 6px;">Название</th>
          <th style="padding:4px 6px;">Начало</th><th style="padding:4px 6px;">Конец</th>
          <th style="padding:4px 6px;">Статус</th><th style="padding:4px 6px;">Задачи</th>
          <th style="padding:4px 6px;"></th>
        </tr></thead>
        <tbody>
        ${stages.map((s,i)=>{
          const cls=i<currentIdx?'Пройдена':i===currentIdx?'Текущая':'Будущая';
          const stageTasks=allTasks.filter(t=>t.stage===s.id);
          const sDone=stageTasks.filter(t=>t.status==='done').length;
          return `<tr style="border-bottom:1px solid var(--border);">
            <td style="padding:5px 6px;"><span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${s.color};vertical-align:middle;"></span></td>
            <td style="padding:5px 6px;font-weight:500;">${s.name}</td>
            <td style="padding:5px 6px;">${s.startDate?formatDate(s.startDate):'—'}</td>
            <td style="padding:5px 6px;">${s.endDate?formatDate(s.endDate):'—'}</td>
            <td style="padding:5px 6px;"><span class="badge ${i<currentIdx?'badge-green':i===currentIdx?'badge-blue':'badge-grey'}">${cls}</span></td>
            <td style="padding:5px 6px;">${stageTasks.length?`${sDone}/${stageTasks.length}`:'-'}</td>
            <td style="padding:5px 6px;white-space:nowrap;">
              <button class="btn-ghost" onclick="editStage('${p.id}',${i})" title="Редактировать">✏️</button>
              <button class="btn-ghost" onclick="removeStage('${p.id}',${i})" title="Удалить">×</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
    `:''}
    `:''}
  </div>`;
}

window.addProject=()=>{
  const inp=document.getElementById('new-proj-name');
  const statusSel=document.getElementById('new-proj-status');
  if(!inp||!inp.value.trim())return;
  const status=statusSel?statusSel.value:'active';
  S.projects.push({id:uid(),name:inp.value.trim(),status,stages:[],currentStage:0});
  logActivity(`создал(а) проект «${inp.value.trim()}»`, 'info');
  saveShared();render();
};
window.renameProject=(id)=>{
  const p=S.projects.find(x=>x.id===id);if(!p)return;
  renameDialog={
    title:'Переименовать проект',
    label:'Название проекта',
    value:p.name,
    onSave:(val)=>{ if(val.trim()){p.name=val.trim();saveShared();} }
  };
  render();
};
window.setProjectStatus=(id,status)=>{
  const p=S.projects.find(x=>x.id===id);if(!p)return;
  p.status=status;
  p.archived=(status==='archived');
  logActivity(`перевёл(а) проект «${p.name}» → ${status==='planned'?'Планируется':status==='active'?'В работе':'Завершён'}`, status==='archived'?'progress':'change');
  saveShared();render();
};
window.deleteProject=(id)=>{
  confirmDialog={
    message:'Удалить проект и все его задачи? Это действие нельзя отменить.',
    onConfirm:()=>{
      S.projects=S.projects.filter(x=>x.id!==id);
      S.tasks=S.tasks.filter(t=>t.project!==id);
      saveShared();render();
    }
  };
  render();
};
window.setGateState=(pid,gid,state)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  if(!p.gates||!p.gates.length)p.gates=projectGates(p);
  const g=p.gates.find(x=>x.id===gid);if(!g)return;
  g.state=state;
  const lbl=(GATE_STATES.find(s=>s.id===state)||{}).label;
  logActivity(`изменил(а) допуск «${g.name}» → ${lbl} (${p.name})`, state==='done'?'progress':'change');
  saveShared();render();
};
window.addGate=(pid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  if(!p.gates||!p.gates.length)p.gates=projectGates(p);
  renameDialog={
    title:'Новый допуск',
    label:'Название',
    value:'',
    onSave:(val)=>{
      if(val.trim()){
        p.gates.push({id:uid(),name:val.trim(),state:'todo'});
        logActivity(`добавил(а) допуск «${val.trim()}» в проект «${p.name}»`,'info');
        saveShared();
      }
    }
  };
  render();
};
window.editGate=(pid,gid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  if(!p.gates||!p.gates.length)p.gates=projectGates(p);
  const g=p.gates.find(x=>x.id===gid);if(!g)return;
  renameDialog={
    title:'Редактировать допуск',
    label:'Название',
    value:g.name,
    onSave:(val)=>{
      if(val.trim()){g.name=val.trim();saveShared();}
    }
  };
  render();
};
window.removeGate=(pid,gid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  if(!p.gates||!p.gates.length)p.gates=projectGates(p);
  const g=p.gates.find(x=>x.id===gid);
  confirmDialog={
    message:`Удалить допуск «${g?g.name:''}»?`,
    onConfirm:()=>{
      p.gates=p.gates.filter(x=>x.id!==gid);
      saveShared();render();
    }
  };
  render();
};
window.toggleMilestoneGates=(pid,mid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p||!p.milestones)return;
  const m=p.milestones.find(x=>x.id===mid);if(!m)return;
  m.needsGates=!m.needsGates;
  saveShared();render();
};
window.addMilestone=(pid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  const name=document.getElementById('ms-name-'+pid)?.value.trim();
  const date=document.getElementById('ms-date-'+pid)?.value||'';
  if(!name||!date)return;
  if(!p.milestones)p.milestones=[];
  p.milestones.push({id:uid(),name,date,done:false});
  logActivity(`добавил(а) контрольную точку «${name}» (${formatDate(date)}) в проект «${p.name}»`,'info');
  saveShared();render();
};
window.removeMilestone=(pid,mid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p||!p.milestones)return;
  const m=p.milestones.find(x=>x.id===mid);
  confirmDialog={
    message:`Удалить контрольную точку «${m?m.name:''}»?`,
    onConfirm:()=>{
      p.milestones=p.milestones.filter(x=>x.id!==mid);
      if(m) logActivity(`удалил(а) контрольную точку «${m.name}» из проекта «${p.name}»`,'alert');
      saveShared();render();
    }
  };
  render();
};
window.toggleMilestone=(pid,mid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p||!p.milestones)return;
  const m=p.milestones.find(x=>x.id===mid);if(!m)return;
  m.done=!m.done;
  logActivity(m.done?`отметил(а) контрольную точку «${m.name}» пройденной`:`снял(а) отметку с контрольной точки «${m.name}»`, m.done?'progress':'change');
  saveShared();render();
};
window.openMilestone=(pid,mid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p||!p.milestones)return;
  const m=p.milestones.find(x=>x.id===mid);if(!m)return;
  if(!isLeadership())return;
  renameDialog={
    title:'Редактировать контрольную точку',
    label:'Название',
    value:m.name,
    label2:'Дата',
    type2:'date',
    value2:m.date||'',
    onSave:(name,date)=>{
      if(name.trim())m.name=name.trim();
      if(date.trim())m.date=date.trim();
      saveShared();
    }
  };
  render();
};
window.applyMilestoneTemplate=(pid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  const base=new Date();
  if(!p.milestones)p.milestones=[];
  MILESTONE_TEMPLATES.forEach(t=>{
    const d=new Date(base.getTime()+t.offset*86400000);
    p.milestones.push({id:uid(),name:t.name,date:d.toISOString().slice(0,10),done:false,needsGates:!!t.gated});
  });
  logActivity(`применил(а) типовой набор контрольных точек к проекту «${p.name}»`,'info');
  saveShared();render();
};
window.addStage=(pid)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  const name=document.getElementById('stage-name-'+pid)?.value.trim();
  const color=document.getElementById('stage-color-'+pid)?.value||'#2563EB';
  const startDate=document.getElementById('stage-start-'+pid)?.value||'';
  const endDate=document.getElementById('stage-end-'+pid)?.value||'';
  if(!name)return;
  if(!p.stages)p.stages=[];
  p.stages.push({id:uid(),name,color,startDate,endDate});
  saveShared();render();
};
window.editStage=(pid,idx)=>{
  editingStage={projectId:pid,idx};render();
};
window.saveStageEdit=()=>{
  if(!editingStage)return;
  const p=S.projects.find(x=>x.id===editingStage.projectId);
  if(!p||!p.stages||!p.stages[editingStage.idx])return;
  const s=p.stages[editingStage.idx];
  const name=document.getElementById('edit-stage-name')?.value.trim();
  const color=document.getElementById('edit-stage-color')?.value;
  const startDate=document.getElementById('edit-stage-start')?.value||'';
  const endDate=document.getElementById('edit-stage-end')?.value||'';
  if(name)s.name=name;
  if(color)s.color=color;
  s.startDate=startDate;
  s.endDate=endDate;
  editingStage=null;
  saveShared();render();
};
window.closeStageEdit=()=>{editingStage=null;render();};

function renderConfirmModal(){
  if(!confirmDialog)return'';
  return `
  <div class="overlay open" onclick="if(event.target===this){closeConfirmDialog()}">
    <div class="modal" style="max-width:380px;">
      <button class="modal-close" onclick="closeConfirmDialog()">✕</button>
      <h2 style="margin-bottom:14px;font-size:18px;">Подтверждение</h2>
      <p style="font-size:14px;color:var(--ink2);margin-bottom:18px;">${confirmDialog.message}</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-danger" style="background:var(--red);color:#fff;border:none;" onclick="runConfirmDialog()">Удалить</button>
        <button class="btn-ghost" onclick="closeConfirmDialog()">Отмена</button>
      </div>
    </div>
  </div>`;
}
window.closeConfirmDialog=()=>{confirmDialog=null;render();};
window.runConfirmDialog=()=>{
  if(confirmDialog&&confirmDialog.onConfirm)confirmDialog.onConfirm();
  confirmDialog=null;
};

function renderRenameModal(){
  if(!renameDialog)return'';
  const d=renameDialog;
  return `
  <div class="overlay open" onclick="if(event.target===this){closeRenameDialog()}">
    <div class="modal" style="max-width:400px;">
      <button class="modal-close" onclick="closeRenameDialog()">✕</button>
      <h2 style="margin-bottom:14px;font-size:18px;">${d.title}</h2>
      <div class="field mb12"><label>${d.label}</label>
        <input type="text" id="rename-field-1" value="${d.value}">
      </div>
      ${d.label2?`
      <div class="field mb12"><label>${d.label2}</label>
        <input type="${d.type2||'text'}" id="rename-field-2" value="${d.value2||''}">
      </div>`:''}
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="runRenameDialog()">Сохранить</button>
        <button class="btn-ghost" onclick="closeRenameDialog()">Отмена</button>
      </div>
    </div>
  </div>`;
}
window.closeRenameDialog=()=>{renameDialog=null;render();};
window.runRenameDialog=()=>{
  if(!renameDialog)return;
  const v1=document.getElementById('rename-field-1')?.value||'';
  const v2=document.getElementById('rename-field-2')?.value||'';
  if(renameDialog.label2){ renameDialog.onSave(v1,v2); }
  else { renameDialog.onSave(v1); }
  renameDialog=null;
  render();
};

function renderStageModal(){
  if(!editingStage)return'';
  const p=S.projects.find(x=>x.id===editingStage.projectId);
  if(!p||!p.stages||!p.stages[editingStage.idx])return'';
  const s=p.stages[editingStage.idx];
  return `
  <div class="overlay open" onclick="if(event.target===this){closeStageEdit()}">
    <div class="modal" style="max-width:440px;">
      <button class="modal-close" onclick="closeStageEdit()">✕</button>
      <h2 style="margin-bottom:16px;">Редактировать стадию</h2>
      <div class="field mb12"><label>Название</label>
        <input type="text" id="edit-stage-name" value="${s.name}">
      </div>
      <div class="row">
        <div class="field"><label>Цвет</label>
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="color" id="edit-stage-color" value="${s.color}" style="width:50px;height:38px;padding:2px;border:1px solid var(--border);border-radius:6px;">
            <span style="font-size:12px;color:var(--ink3);">${s.color}</span>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="field"><label>Дата начала</label>
          <input type="date" id="edit-stage-start" value="${s.startDate||''}">
        </div>
        <div class="field"><label>Дата конца</label>
          <input type="date" id="edit-stage-end" value="${s.endDate||''}">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-primary" onclick="saveStageEdit()">Сохранить</button>
        <button class="btn-ghost" onclick="closeStageEdit()">Отмена</button>
      </div>
    </div>
  </div>`;
}
window.removeStage=(pid,idx)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p||!p.stages)return;
  p.stages.splice(idx,1);
  if(p.currentStage>=p.stages.length)p.currentStage=Math.max(0,p.stages.length-1);
  saveShared();render();
};
window.setCurrentStage=(pid,idx)=>{
  const p=S.projects.find(x=>x.id===pid);if(!p)return;
  p.currentStage=idx;saveShared();render();
};

// ── My Load ──
function renderMyLoad(){
  const my=S.tasks.filter(t=>t.assignee===S.currentUser&&!t.deleted);
  const active=my.filter(t=>t.status!=='done');
  const done=my.filter(t=>t.status==='done');
  const myOverdue=active.filter(t=>isOverdue(t)).length;
  const mySoon=active.filter(t=>isDueSoon(t)).length;

  // Get unique projects for this user's tasks
  const myProjectIds=[...new Set(active.map(t=>t.project))];
  const myProjects=myProjectIds.map(pid=>S.projects.find(p=>p.id===pid)).filter(Boolean);

  return `
  <div class="card">
    <h2>Моя загрузка</h2>
    <div style="display:flex;gap:14px;font-size:13px;margin-top:4px;flex-wrap:wrap;">
      <span>📋 ${active.length} активных</span>
      <span style="color:var(--green)">✓ ${done.length} закрыто</span>
      ${myOverdue?`<span style="color:var(--red);font-weight:500">⚠ ${myOverdue} просрочено</span>`:''}
      ${mySoon?`<span style="color:var(--amber);font-weight:500">🔥 ${mySoon} горит</span>`:''}
    </div>
  </div>

  ${myProjects.map(p=>{
    const pTasks=sortTasks(active.filter(t=>t.project===p.id));
    if(!pTasks.length)return'';
    const currentStage=(p.stages||[])[(p.currentStage||0)];
    return `<div class="card">
      <div class="flex-between" style="margin-bottom:10px;">
        <h3 style="margin:0;">${p.name}</h3>
        ${currentStage?`<span class="badge" style="background:${currentStage.color};color:${contrastText(currentStage.color)};padding:2px 8px;font-size:11px;">▶ ${currentStage.name}</span>`:''}
      </div>
      ${STATUSES.filter(s=>s.id!=='done').map(s=>{
        const list=pTasks.filter(t=>t.status===s.id);
        if(!list.length)return'';
        return `
        <div style="margin-bottom:6px;">
          <span class="badge ${s.dotClass}" style="margin-bottom:4px;display:inline-block;">${s.label} (${list.length})</span>
          ${list.map(t=>`
            <div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;cursor:pointer;" onclick="openTask('${t.id}')">
              <span class="priority-dot p-${t.priority}"></span>
              <span style="flex:1;font-size:13.5px;">${t.title}</span>
              ${t.due?`<span style="font-size:12px;${isOverdue(t)?'color:var(--red);font-weight:500':isDueSoon(t)?'color:var(--amber);font-weight:500':'color:var(--ink3)'}">${formatDate(t.due)}${isDueSoon(t)?' 🔥':''}</span>`:''}
            </div>
          `).join('')}
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}

  ${done.length?`<div class="card"><h3><span class="badge badge-green">Проверено и закрыто</span> — ${done.length}</h3>
    ${done.slice(0,10).map(t=>`
      <div style="padding:4px 0;font-size:13px;color:var(--ink3);text-decoration:line-through;">${t.title} <span style="font-size:11px;">(${projName(t.project)})</span></div>
    `).join('')}
    ${done.length>10?`<div style="font-size:12px;color:var(--ink3);">и ещё ${done.length-10}…</div>`:''}
  </div>`:''}
  ${my.length===0?'<div class="empty">У тебя пока нет назначенных задач</div>':''}
  `;
}

// ── Team ──
function renderTeam(){
  return `
  <div class="card">
    <h2>Обзор команды</h2>
  </div>
  <div class="team-grid mb12">
    ${S.team.map(m=>{
      const active=S.tasks.filter(t=>t.assignee===m.id&&t.status!=='done'&&!t.deleted);
      const overdue=active.filter(t=>isOverdue(t));
      return `<div class="member-card">
        <div class="member-role">${m.role}</div>
        <div class="member-name">${m.name}</div>
        <div class="member-stats">
          ${active.length} активных задач
          ${overdue.length?`<br><span class="member-overdue">${overdue.length} просрочено</span>`:''}
        </div>
        <div style="margin-top:8px;display:flex;gap:4px;">
          <button class="btn-ghost" onclick="editMember('${m.id}')">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="removeMember('${m.id}')">×</button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="card">
    <h3>Добавить участника</h3>
    <div class="row">
      <div class="field"><label>Роль</label><input type="text" id="add-role" placeholder="Стафф"></div>
      <div class="field"><label>Имя</label><input type="text" id="add-name" placeholder="Имя"></div>
      <div class="field" style="flex:0"><button class="btn btn-primary" onclick="addMember()">Добавить</button></div>
    </div>
  </div>
  ${S.team.length===0?'<div class="empty">Добавь участников команды</div>':''}
  `;
}

window.addMember=()=>{
  const role=document.getElementById('add-role')?.value.trim();
  const name=document.getElementById('add-name')?.value.trim();
  if(!role||!name)return;
  S.team.push({id:uid(),role,name});
  saveShared();render();
};
window.addFirstMember=()=>{
  const role=document.getElementById('init-role')?.value.trim();
  const name=document.getElementById('init-name')?.value.trim();
  if(!role||!name)return;
  S.team.push({id:uid(),role,name});
  saveShared();render();
};
window.editMember=(id)=>{
  const m=S.team.find(x=>x.id===id);if(!m)return;
  renameDialog={
    title:'Редактировать участника',
    label:'Роль',
    value:m.role,
    label2:'Имя',
    value2:m.name,
    onSave:(role,name)=>{
      if(role.trim())m.role=role.trim();
      if(name.trim())m.name=name.trim();
      saveShared();
    }
  };
  render();
};
window.removeMember=(id)=>{
  confirmDialog={
    message:'Удалить участника из команды?',
    onConfirm:()=>{
      S.team=S.team.filter(x=>x.id!==id);
      if(S.currentUser===id){S.currentUser=null;saveUser();}
      saveShared();render();
    }
  };
  render();
};

// ── Navigation ──
window.switchTab=(t)=>{activeTab=t;render();};
window.toggleTheme=()=>{
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',isDark?'light':'dark');
  try{localStorage.setItem('team-tracker-theme',isDark?'light':'dark');}catch(e){}
  render();
};
window.selectUser=(id, needsPin)=>{
  if(needsPin){
    // Show PIN modal
    pinDialog = {userId: id};
    render();
    return;
  }
  S.currentUser=id;saveUser();requestNotifPermission();render();
};
window.verifyPin=()=>{
  const input = document.getElementById('pin-input');
  if(!input) return;
  const entered = input.value.trim();
  const savedPin = S.managerPin || '0000';
  if(entered === savedPin){
    S.currentUser = pinDialog.userId;
    pinDialog = null;
    saveUser();render();
  } else {
    document.getElementById('pin-error').textContent = 'Неверный PIN';
  }
};
window.changeManagerPin=()=>{
  renameDialog = {
    title: 'Установить PIN менеджера',
    label: 'Новый PIN (4+ цифр)',
    value: S.managerPin || '0000',
    onSave:(val)=>{
      if(val.trim().length >= 4){
        S.managerPin = val.trim();
        saveShared();
      }
    }
  };
  render();
};
window.changeUser=()=>{S.currentUser=null;saveUser();render();};

function bindEvents(){}

// ── Init ──
// Load saved theme
try{
  const savedTheme=localStorage.getItem('team-tracker-theme')||'dark';
  document.documentElement.setAttribute('data-theme',savedTheme);
}catch(e){document.documentElement.setAttribute('data-theme','dark');}
// 1. Сразу загружаем из localStorage (мгновенно, даже без сети)
loadShared();
loadUser();
render();
// 2. Если Firebase подключён — он перезапишет данными из облака через listener
</script>
</body>
</html>
